<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wijk Racer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dfeeff; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; inset: auto 24px 20px 250px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
    #street { font-size: 28px; font-weight: 600; }
    #speed { font-size: 56px; font-weight: 800; line-height: 1; }
    #speed small { font-size: 18px; margin-left: 6px; }
    #hint { position: fixed; top: 16px; left: 24px; color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); font-size: 14px; opacity: .85; }
#travel { position: fixed; top: 16px; right: 16px; width: 300px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: rgba(20, 24, 32, .92); color: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); overflow: hidden; }
#travel[hidden] { display: none; }
#travel h2 { margin: 0; padding: 12px 16px; font: 600 15px system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; opacity: .7; }
#travel-list li.town { padding: 10px 16px 4px; cursor: default; font-weight: 700; color: #ffd166; }
#travel-list li.town:hover { background: none; }
#travel-list { margin: 0; padding: 0 0 8px; list-style: none; overflow-y: auto; }
#travel-list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; cursor: pointer; font: 15px system-ui, sans-serif; }
#travel-list li:hover { background: rgba(255, 255, 255, .12); }
#travel-list small { opacity: .6; }
    #coins { position: fixed; top: 44px; left: 24px; color: #ffd166; font: 700 22px system-ui, sans-serif; text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
    #coins img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #ffd166; vertical-align: middle; margin-right: 4px; object-fit: cover; }
    #coins.bump { animation: bump .4s; }
    @keyframes bump { 40% { transform: scale(1.35); } }
    #townsign { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); padding: 14px 36px; border: 5px solid #fff; outline: 3px solid #0d4fa0; border-radius: 6px; background: #0d4fa0; color: #fff; font: 700 44px/1 system-ui, sans-serif; letter-spacing: .02em; text-transform: uppercase; opacity: 0; pointer-events: none; }
    #townsign.show { animation: townsign 4.5s ease-in-out forwards; }
    @keyframes townsign { 0% { opacity: 0; transform: translate(-50%, -20px); } 12% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; } 100% { opacity: 0; } }
    #minimap { position: fixed; left: 24px; bottom: 20px; width: 200px; height: 200px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .85); background: #cfe3b5; box-shadow: 0 4px 16px rgba(0, 0, 0, .35); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="hint">Pijltjes of WASD · Shift = handrem · T = fast travel</div>
<div id="coins"><img src="assets/gcoin.jpg" alt=""> <span>0</span> G-Points</div>
<div id="townsign"></div>
<div id="travel" hidden>
  <h2>Fast travel</h2>
  <ul id="travel-list"></ul>
</div>
  <canvas id="minimap" width="400" height="400"></canvas>
  <div id="hud">
    <div id="street"></div>
    <div id="speed">0<small>km/u</small></div>
  </div>
  <script type="module">import(`./game.js?${Date.now()}`)</script>
</body>
</html>
