<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wijk Racer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dfeeff; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; inset: auto 24px 20px 250px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
    #street { font-size: 28px; font-weight: 600; }
    #speed { font-size: 56px; font-weight: 800; line-height: 1; }
    #speed small { font-size: 18px; margin-left: 6px; }
    #hint { position: fixed; top: 16px; left: 24px; color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); font-size: 14px; opacity: .85; }
#travel { position: fixed; top: 16px; right: 16px; width: 300px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: rgba(20, 24, 32, .92); color: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); overflow: hidden; }
#travel[hidden] { display: none; }
#travel h2 { margin: 0; padding: 12px 16px; font: 600 15px system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; opacity: .7; }
#travel-list li.town { padding: 10px 16px 4px; cursor: default; font-weight: 700; color: #ffd166; }
#travel-list li.town:hover { background: none; }
#travel-list { margin: 0; padding: 0 0 8px; list-style: none; overflow-y: auto; }
#travel-list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; cursor: pointer; font: 15px system-ui, sans-serif; }
#travel-list li:hover { background: rgba(255, 255, 255, .12); }
#travel-list small { opacity: .6; }
    #coins { position: fixed; top: 44px; left: 24px; color: #ffd166; font: 700 22px system-ui, sans-serif; text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
    #coins img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #ffd166; vertical-align: middle; margin-right: 4px; object-fit: cover; filter: sepia(1) saturate(4) hue-rotate(-8deg) brightness(1.05); }
    #players { position: fixed; top: 92px; left: 24px; color: #fff; font: 600 15px/1.5 system-ui, sans-serif; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
    #players .me { color: #ffd166; cursor: pointer; }
        #players .me:hover { text-decoration: underline; }
        #players small { font-weight: 400; opacity: .8; }
    #bigmap[hidden] { display: none; }
#bigmap { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 12px; box-shadow: 0 12px 48px rgba(0, 0, 0, .6); z-index: 9; }
    #loading-name { position: absolute; right: 0; top: -60px; font: 14px system-ui, sans-serif; opacity: .9; }
    #loading-name input { margin-left: 8px; padding: 6px 10px; border: 0; border-radius: 6px; font: 15px system-ui, sans-serif; width: 160px; }
    #coins.bump { animation: bump .4s; }
    @keyframes bump { 40% { transform: scale(1.35); } }
    #townsign { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); padding: 14px 36px; border: 5px solid #fff; outline: 3px solid #0d4fa0; border-radius: 6px; background: #0d4fa0; color: #fff; font: 700 44px/1 system-ui, sans-serif; letter-spacing: .02em; text-transform: uppercase; opacity: 0; pointer-events: none; }
    #townsign.show { animation: townsign 4.5s ease-in-out forwards; }
    @keyframes townsign { 0% { opacity: 0; transform: translate(-50%, -20px); } 12% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; } 100% { opacity: 0; } }
    #loading { position: fixed; inset: 0; z-index: 10; background: #0b0d12; color: #fff; overflow: hidden; transition: opacity .8s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading-slides img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kenburns 9s ease-out forwards, fadein 1.2s ease-out; }
    #loading-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, .92) 0%, rgba(0, 0, 0, .35) 45%, rgba(0, 0, 0, 0) 100%); }
    #loading-text { position: absolute; left: 6vw; right: 6vw; bottom: 8vh; font-family: system-ui, sans-serif; }
    #loading-text h1 { margin: 0; font-size: 72px; font-weight: 900; letter-spacing: .02em; text-transform: uppercase; line-height: 1; text-shadow: 0 4px 24px rgba(0, 0, 0, .8); }
    #loading-text h2 { margin: 6px 0 22px; font-size: 24px; font-weight: 500; color: #ffd166; letter-spacing: .12em; text-transform: uppercase; }
    #loading-tip { max-width: 640px; font-size: 18px; line-height: 1.4; opacity: .9; }
    #loading-bar { height: 6px; background: rgba(255, 255, 255, .2); border-radius: 3px; overflow: hidden; margin-top: 18px; }
    #loading-bar i { display: block; height: 100%; width: 0; background: #ffd166; transition: width .4s; }
    #loading-phase { display: block; margin-top: 8px; font-size: 14px; opacity: .7; }
    #loading-credits { position: absolute; right: 0; bottom: -28px; font-size: 11px; opacity: .45; }
    #loading-music { position: absolute; left: 0; bottom: -28px; font-size: 12px; opacity: .6; }
    @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12) translate(-1.5%, -1%); } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    #minimap { position: fixed; left: 24px; bottom: 20px; width: 200px; height: 200px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .85); background: #cfe3b5; box-shadow: 0 4px 16px rgba(0, 0, 0, .35); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="loading">
  <div id="loading-slides"></div>
  <div id="loading-shade"></div>
  <div id="loading-text">
    <h1>Wijk Racer</h1>
    <h2>Sittard-Geleen</h2>
    <p id="loading-tip"></p>
    <div id="loading-bar"><i></i></div>
    <small id="loading-phase">Laden…</small>
    <small id="loading-music">Druk op een toets voor muziek</small>
    <label id="loading-name">Naam <input id="player-name" maxlength="16" autocomplete="off"></label>
    <small id="loading-credits"></small>
  </div>
</div>
<div id="hint">Pijltjes of WASD · Shift = handrem · T = fast travel</div>
<div id="coins"><img src="assets/gcoin.jpg" alt=""> <span>0</span> G-Points</div>
<div id="players"></div>
<canvas id="bigmap" hidden></canvas>
<div id="townsign"></div>
<div id="travel" hidden>
  <h2>Fast travel</h2>
  <ul id="travel-list"></ul>
</div>
  <canvas id="minimap" width="400" height="400"></canvas>
  <div id="hud">
    <div id="street"></div>
    <div id="speed">0<small>km/u</small></div>
  </div>
  <script type="module">import(`./game.js?${Date.now()}`)</script>
</body>
</html>
